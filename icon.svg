<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Flapping Ears Trail -->
  <path d="M 120 180 C 60 140, 40 240, 110 280 C 140 260, 160 210, 120 180 Z" fill="url(#ear)" opacity="0.9"/>
  <path d="M 392 180 C 452 140, 472 240, 402 280 C 372 260, 352 210, 392 180 Z" fill="url(#ear)" opacity="0.9"/>

  <!-- Dog Head Base -->
  <ellipse cx="256" cy="270" rx="120" ry="105" fill="url(#fur)"/>

  <!-- Snout -->
