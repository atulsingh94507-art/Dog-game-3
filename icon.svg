  <!-- Cute Eyes -->
  <circle cx="210" cy="235" r="16" fill="#0F172A"/>
  <circle cx="205" cy="230" r="5" fill="#FFFFFF"/>

  <circle cx="302" cy="235" r="16" fill="#0F172A"/>
  <circle cx="297" cy="230" r="5" fill="#FFFFFF"/>

  <!-- Tongue -->
  <path d="M 244 320 C 244 345, 268 345, 268 320 Z" fill="#F43F5E"/>

  <!-- Sparkles -->
